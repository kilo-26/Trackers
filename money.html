<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.14.1/firebase-database-compat.js"></script>
<script src="config.js"></script>
<link rel="apple-touch-icon" href="icon-money.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Money">
<title>Alia &amp; Lara · Money</title>
<style>
:root{--bg:#f7f7f3;--surface:#fff;--ink:#1c1c1a;--muted:#6b6b64;--line:#dedfd6;--accent:#0f766e;--accent-ink:#fff;--in:#067647;--out:#b42318;--alia:#6d28d9;--lara:#0369a1;--chip:#efefe8}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141413;--surface:#1f1f1d;--ink:#efefe9;--muted:#a3a39a;--line:#34342f;--accent:#2dd4bf;--accent-ink:#06201d;--in:#4ade80;--out:#f87171;--alia:#c4b5fd;--lara:#7dd3fc;--chip:#2a2a27}}
:root[data-theme="dark"]{--bg:#141413;--surface:#1f1f1d;--ink:#efefe9;--muted:#a3a39a;--line:#34342f;--accent:#2dd4bf;--accent-ink:#06201d;--in:#4ade80;--out:#f87171;--alia:#c4b5fd;--lara:#7dd3fc;--chip:#2a2a27}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(32px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.eyebrow{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:2px 0 0;font-size:28px;line-height:1.1;color:var(--accent)}
h2{margin:0;font-size:17px}
.balances{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.bal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;border-top:4px solid var(--c)}
.bal[data-k="alia"]{--c:var(--alia)}.bal[data-k="lara"]{--c:var(--lara)}
.bal .name{font-weight:700;color:var(--c)}
.bal .num{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums;margin:4px 0 2px;overflow-wrap:anywhere}
.bal .num.neg{color:var(--out)}
.bal .sub{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.lab{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase;margin-bottom:-6px}
.seg{display:flex;gap:8px}
.seg button,.chips button{flex:1;font:inherit;font-weight:600;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted);font-weight:600;flex:1;min-width:0}
input{font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px;width:100%;min-width:0}
input:focus,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.two{display:flex;gap:10px}
.primary{font:inherit;font-weight:700;padding:13px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.primary:active{transform:scale(.99)}
.err{color:var(--out);font-size:14px;min-height:0}.err:empty{display:none}
.ok{color:var(--in);font-size:14px}.ok:empty{display:none}
.head{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.chips{display:flex;gap:6px}
.chips button{flex:none;padding:5px 12px;font-size:13px;border-radius:99px;background:var(--chip)}
.chips button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.reason{font-weight:600;overflow-wrap:anywhere}
.meta{font-size:12px;color:var(--muted)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.row.topup .amt{color:var(--in)}.row.spend .amt{color:var(--out)}
.del{font:inherit;font-size:20px;line-height:1;width:32px;height:32px;border-radius:50%;border:0;background:transparent;color:var(--muted);cursor:pointer}
.del:hover{background:var(--chip)}
.empty{margin:0;color:var(--muted);font-size:14px}
.ghost{font:inherit;font-weight:600;padding:9px;border-radius:12px;border:1.5px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
footer{font-size:12px;color:var(--muted)}
.sync{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sync::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--muted)}
.sync[data-s="synced"]::before{background:var(--in)}.sync[data-s="error"]::before{background:var(--out)}
[hidden]{display:none!important}
</style>
<div class="app">
  <header><div class="eyebrow">Pocket money</div><h1>Alia &amp; Lara</h1></header>

  <section class="balances" aria-label="Balances">
    <div class="bal" data-k="alia"><div class="name">Alia</div><div class="num" id="bal-alia">AED 0.00</div><div class="sub" id="sub-alia"></div></div>
    <div class="bal" data-k="lara"><div class="name">Lara</div><div class="num" id="bal-lara">AED 0.00</div><div class="sub" id="sub-lara"></div></div>
  </section>

  <section class="card" aria-labelledby="addh">
    <h2 id="addh">Add an entry</h2>
    <div class="lab">Who</div>
    <div class="seg" id="kidSeg"><button type="button" data-v="alia" aria-pressed="true">Alia</button><button type="button" data-v="lara" aria-pressed="false">Lara</button></div>
    <div class="lab">What</div>
    <div class="seg" id="typeSeg"><button type="button" data-v="topup" aria-pressed="true">Top up (+)</button><button type="button" data-v="spend" aria-pressed="false">Spend (&minus;)</button></div>
    <div class="two">
      <label>Amount (AED)<input id="amount" inputmode="decimal" autocomplete="off" placeholder="0.00"></label>
      <label>Date<input id="date" type="date"></label>
    </div>
    <label>Source / reason<input id="reason" maxlength="100" list="sugg" autocomplete="off" placeholder="e.g. Pocket money, Gift, Toy shop"></label>
    <datalist id="sugg"><option value="Pocket money"><option value="Gift"><option value="Birthday"><option value="Chores"><option value="Savings"><option value="Toys"><option value="Snacks"><option value="Books"><option value="Clothes"></datalist>
    <button class="primary" id="add" type="button">Add top-up for Alia</button>
    <div class="err" id="err" role="alert"></div>
    <div class="ok" id="saved" role="status"></div>
  </section>

  <section class="card" aria-labelledby="histh">
    <div class="head"><h2 id="histh">History</h2>
      <div class="chips" id="filterSeg"><button type="button" data-v="all" aria-pressed="true">Everyone</button><button type="button" data-v="alia" aria-pressed="false">Alia</button><button type="button" data-v="lara" aria-pressed="false">Lara</button></div>
    </div>
    <ul class="list" id="list"></ul>
    <p class="empty" id="empty">No entries yet.</p>
    <button class="ghost" id="more" type="button" hidden>Show older entries</button>
  </section>

  <footer><div class="sync" id="sync" data-s="local">Saved on this device</div></footer>
</div>
<script>
(function(){
"use strict";
const $=id=>document.getElementById(id);
const KIDS={alia:"Alia",lara:"Lara"};
const CODE_RE=/^[A-Za-z0-9]{20,40}$/;
const MAX_FILS=10000000; // AED 100,000
let kid="alia",type="topup",filter="all",limit=60,ref=null,code=null,entries={},cacheKey="money.entries.local",pend=[];

/* ---------- helpers ---------- */
const valid=e=>!!e&&!!KIDS[e.kid]&&(e.type==="topup"||e.type==="spend")&&typeof e.amount==="number"&&e.amount>0&&typeof e.reason==="string"&&typeof e.date==="string";
function money(f){return (f<0?"\u2212":"")+"AED "+(Math.abs(f)/100).toLocaleString("en-GB",{minimumFractionDigits:2,maximumFractionDigits:2})}
function fmtDate(s){const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(s);if(!m)return s;return new Date(+m[1],+m[2]-1,+m[3]).toLocaleDateString("en-GB",{day:"numeric",month:"short",year:"numeric"})}
function todayStr(){const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())}
function parseAmount(s){
  s=String(s).trim().replace(/[^\d.,]/g,"");if(!s)return NaN;
  s=s.replace(/,(?=\d{3}(\D|$))/g,"").replace(/,/g,"."); // 1,000 -> 1000 ; 12,50 -> 12.50
  const parts=s.split(".");if(parts.length>2){const dec=parts.pop();s=parts.join("")+"."+dec}
  const n=parseFloat(s);return Number.isFinite(n)?Math.round(n*100):NaN;
}
function saveLocal(){try{localStorage.setItem(cacheKey,JSON.stringify(entries))}catch(e){}}
function loadLocal(){try{entries=JSON.parse(localStorage.getItem(cacheKey)||"{}")||{}}catch(e){entries={}}}
function totals(){const t={alia:{in:0,out:0},lara:{in:0,out:0}};Object.keys(entries).forEach(id=>{const e=entries[id];if(valid(e))t[e.kid][e.type==="topup"?"in":"out"]+=e.amount});return t}

/* ---------- rendering ---------- */
function renderBalances(){
  const t=totals();
  ["alia","lara"].forEach(k=>{
    const bal=t[k].in-t[k].out,el=$("bal-"+k);
    el.textContent=money(bal);el.classList.toggle("neg",bal<0);
    $("sub-"+k).textContent="In "+money(t[k].in)+" \u00b7 Out "+money(t[k].out);
  });
}
function renderList(){
  const list=$("list");list.textContent="";
  const ids=Object.keys(entries).filter(id=>valid(entries[id])&&(filter==="all"||entries[id].kid===filter))
    .sort((a,b)=>{const A=entries[a],B=entries[b];return B.date.localeCompare(A.date)||((B.at||0)-(A.at||0))});
  $("empty").hidden=ids.length>0;
  ids.slice(0,limit).forEach(id=>{
    const e=entries[id],li=document.createElement("li");li.className="row "+e.type;
    const main=document.createElement("div"),r=document.createElement("div"),m=document.createElement("div");
    r.className="reason";r.textContent=e.reason;m.className="meta";m.textContent=fmtDate(e.date)+" \u00b7 "+KIDS[e.kid];
    main.append(r,m);
    const amt=document.createElement("div");amt.className="amt";amt.textContent=(e.type==="topup"?"+":"")+money(e.type==="topup"?e.amount:-e.amount);
    const del=document.createElement("button");del.type="button";del.className="del";del.setAttribute("aria-label","Delete this entry");del.textContent="\u00d7";
    del.addEventListener("click",()=>removeEntry(id));
    li.append(main,amt,del);list.append(li);
  });
  $("more").hidden=ids.length<=limit;
}
function renderAll(){renderBalances();renderList()}
function syncSegs(){
  document.querySelectorAll("#kidSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===kid)));
  document.querySelectorAll("#typeSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===type)));
  document.querySelectorAll("#filterSeg button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.v===filter)));
  $("add").textContent=(type==="topup"?"Add top-up for ":"Add spend for ")+KIDS[kid];
}

/* ---------- sync status ---------- */
function setSync(s){const el=$("sync"),btn=$("shareBtn");el.dataset.s=s;
  const txt=s==="synced"?"Family data \u00b7 synced":s==="offline"?"Offline. Changes will sync when you\u2019re back online":s==="error"?"Couldn\u2019t sync. Saved on this device for now":s==="setup"?"Not connected yet (setup needed)":"Saved on this device";
  el.textContent=txt;if(btn)el.appendChild(btn)}
function newCode(){const a=new Uint8Array(24),c="abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789";crypto.getRandomValues(a);return Array.from(a,x=>c[x%c.length]).join("")}
function getCode(){
  let c=(location.hash||"").replace(/^#/,"");
  if(!CODE_RE.test(c)){try{c=localStorage.getItem("fam.code")||""}catch(e){c=""}}
  if(!CODE_RE.test(c)){
    c="";
    if(confirm("First time here?\n\nOK = start a NEW family tracker\nCancel = I already have a family code")){c=newCode()}
    else{const p=(prompt("Paste your family code (or open the family link instead):")||"").trim();if(CODE_RE.test(p))c=p}
  }
  if(!CODE_RE.test(c))return null;
  try{localStorage.setItem("fam.code",c)}catch(e){}
  try{history.replaceState(null,"",location.pathname+location.search+"#"+c)}catch(e){}
  return c;
}
function addShareButton(){
  if($("shareBtn"))return;
  const b=document.createElement("button");b.id="shareBtn";b.type="button";b.textContent="Copy family link";
  b.style.cssText="margin-inline-start:10px;font:inherit;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer";
  b.onclick=async()=>{
    const url=location.origin+location.pathname.replace(/[^\/]*$/,"")+"#"+code;
    try{await navigator.clipboard.writeText(url);b.textContent="Copied"}catch(e){prompt("Copy this link and send it to your family:",url)}
    setTimeout(()=>{b.textContent="Copy family link"},1800);
  };
  $("sync").appendChild(b);
}

/* ---------- writes ---------- */
const PK=()=>"money.pending."+code;
function loadPend(){try{pend=JSON.parse(localStorage.getItem(PK())||"[]")||[]}catch(e){pend=[]}}
function savePend(){try{localStorage.setItem(PK(),JSON.stringify(pend))}catch(e){}}
function writeEntry(id,entry){
  if(pend.indexOf(id)<0){pend.push(id);savePend()}
  ref.child(id).set(entry).then(()=>{pend=pend.filter(x=>x!==id);savePend();setSync("synced")})
    .catch(err=>{if(err&&err.code==="PERMISSION_DENIED"){pend=pend.filter(x=>x!==id);savePend()}setSync("error")});
}
function addEntry(){
  const err=$("err"),ok=$("saved");err.textContent="";ok.textContent="";
  const fils=parseAmount($("amount").value),reason=$("reason").value.trim().replace(/\s+/g," "),date=$("date").value;
  if(!Number.isFinite(fils)||fils<=0){err.textContent="Enter an amount greater than 0.";return}
  if(fils>MAX_FILS){err.textContent="That amount looks too large (the maximum is AED 100,000).";return}
  if(!reason){err.textContent="Add a source or reason.";return}
  if(!/^\d{4}-\d{2}-\d{2}$/.test(date)){err.textContent="Pick a date.";return}
  if(type==="spend"){
    const t=totals()[kid],after=t.in-t.out-fils;
    if(after<0&&!confirm(KIDS[kid]+" only has "+money(t.in-t.out)+". This spend would take the balance to "+money(after)+".\n\nAdd it anyway?"))return;
  }
  const entry={kid,type,amount:fils,reason:reason.slice(0,100),date,at:Date.now()};
  const id=ref?ref.push().key:"l"+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
  entries[id]=entry;saveLocal();renderAll();
  if(ref)writeEntry(id,entry);
  $("amount").value="";$("reason").value="";
  ok.textContent="Added "+(type==="topup"?"top-up":"spend")+" of "+money(fils)+" for "+KIDS[kid]+".";
}
function removeEntry(id){
  const e=entries[id];if(!e)return;
  if(!confirm("Delete this entry?\n\n"+KIDS[e.kid]+" \u00b7 "+(e.type==="topup"?"top-up":"spend")+" \u00b7 "+money(e.amount)+" \u00b7 "+e.reason+"\n\nThis can\u2019t be undone."))return;
  delete entries[id];saveLocal();renderAll();
  pend=pend.filter(x=>x!==id);if(code)savePend();
  if(ref)ref.child(id).remove().then(()=>setSync("synced")).catch(()=>setSync("error"));
}

/* ---------- start ---------- */
function initSync(){
  const cfg=window.FAMILY_FIREBASE_CONFIG;
  if(!window.firebase||!cfg||!cfg.databaseURL||/PASTE/i.test(cfg.databaseURL)){setSync("setup");return}
  code=getCode();
  if(!code){setSync("local");return}
  cacheKey="money.entries."+code;loadLocal();loadPend();renderAll();
  try{
    if(!firebase.apps.length)firebase.initializeApp(cfg);
    const db=firebase.database();
    ref=db.ref("rooms/"+code+"/money/entries");
    let first=true;
    ref.on("value",snap=>{
      const v=snap.val()||{},next={};
      Object.keys(v).forEach(id=>{if(valid(v[id]))next[id]=v[id]});
      if(first){
        first=false;
        // re-send anything this device wrote that never reached the server (e.g. page closed while offline)
        pend.filter(id=>!next[id]&&valid(entries[id])).forEach(id=>{next[id]=entries[id];writeEntry(id,entries[id])});
        pend=pend.filter(id=>next[id]);savePend();
      }
      entries=next;saveLocal();renderAll();setSync("synced");
    },()=>setSync("error"));
    db.ref(".info/connected").on("value",s=>{const cur=$("sync").dataset.s;if(s.val()===false&&cur==="synced")setSync("offline");if(s.val()===true&&cur==="offline")setSync("synced")});
    addShareButton();
  }catch(e){setSync("error")}
}

document.addEventListener("click",e=>{
  const b=e.target.closest("button[data-v]");if(!b)return;
  const seg=b.parentElement.id;
  if(seg==="kidSeg")kid=b.dataset.v;else if(seg==="typeSeg")type=b.dataset.v;else if(seg==="filterSeg"){filter=b.dataset.v;limit=60;renderList()}
  syncSegs();
});
$("add").addEventListener("click",addEntry);
$("more").addEventListener("click",()=>{limit+=60;renderList()});
$("amount").addEventListener("keydown",e=>{if(e.key==="Enter")addEntry()});
$("reason").addEventListener("keydown",e=>{if(e.key==="Enter")addEntry()});
$("date").value=todayStr();
loadLocal();syncSegs();renderAll();
initSync();
})();
</script>
