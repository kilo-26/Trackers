<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Family language trackers</title>
<style>
body{font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;margin:0;padding:max(24px,env(safe-area-inset-top)) 20px 32px;background:#fafaf7;color:#1c1c1a}
main{max-width:420px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:22px;margin:0 0 6px}
a.card{display:block;padding:18px;border-radius:14px;border:1px solid #d9d9d2;background:#fff;color:inherit;text-decoration:none;font-size:18px;font-weight:600}
a.card span{display:block;font-size:13px;font-weight:400;color:#6b6b64;margin-top:4px}
@media (prefers-color-scheme:dark){body{background:#161614;color:#eee}a.card{background:#22221f;border-color:#3a3a35}a.card span{color:#a3a39a}}
</style>
<main>
  <h1>Family language trackers</h1>
  <a class="card" id="ar" href="arabic.html">Jordanian Arabic<span>Daily practice tracker</span></a>
  <a class="card" id="de" href="german.html">German A2<span>Daily practice tracker</span></a>
</main>
<script>
(function(){
  var c=(location.hash||"").replace(/^#/,"");
  if(!/^[A-Za-z0-9]{20,40}$/.test(c)){try{c=localStorage.getItem("fam.code")||""}catch(e){c=""}}
  if(/^[A-Za-z0-9]{20,40}$/.test(c)){
    document.getElementById("ar").href="arabic.html#"+c;
    document.getElementById("de").href="german.html#"+c;
  }
})();
</script>
